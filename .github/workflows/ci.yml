name: CI

on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'extensions/**'
      - 'ci/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'patches-list.json'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'patches/**'
      - 'extensions/**'
      - 'ci/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'patches-list.json'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build-patches:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.7.1'

      - name: Repository consistency
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n1)"
          [[ "$(jq -r '.version' patches-list.json)" == "$VERSION" ]]
          python -m py_compile ci/select_upstream.py ci/verify_patched_apk.py ci/verify_manifest.py
          python -m json.tool ci/baseline.json >/dev/null
          python -m json.tool patches-list.json >/dev/null

      - name: Build Morphe bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle :patches:buildAndroid --no-daemon

      - name: Diagnose VK Video theme providers
        run: |
          set -euo pipefail

          curl -fL --retry 4 \
            -o rustore-downloader.tar.gz \
            "https://github.com/RD2W/rustore-apk-downloader/releases/download/v1.4.0/RuStore_ApkDownloader_v1.4.0_linux-x86_64.tar.gz"
          echo "8ba94847a616b7b5d032285141253b8e3e2cb79d1119b827f558d48b6a157ca0  rustore-downloader.tar.gz" | sha256sum -c -
          mkdir -p tools/rustore /tmp/vklean-theme
          tar -xzf rustore-downloader.tar.gz -C tools/rustore
          chmod +x tools/rustore/rustore_apk_downloader
          tools/rustore/rustore_apk_downloader com.vk.vkvideo /tmp/vklean-theme

          APK="$(find /tmp/vklean-theme -type f -name '*.apk' -print -quit)"
          test -n "$APK"

          curl -fL --retry 4 \
            -o APKEditor.jar \
            "https://github.com/REAndroid/APKEditor/releases/download/V1.4.1/APKEditor-1.4.1.jar"
          java -jar APKEditor.jar d -i "$APK" -o /tmp/vklean-theme/decode >/dev/null

          mkdir -p /tmp/vklean-theme/diag

          find /tmp/vklean-theme/decode -type f -name '*.smali' \
            \( -path '*/com/vk/core/ui/themes/*' \
               -o -path '*/com/vk/sdk/clips/theme/*' \
               -o -path '*/com/vk/clips/sdk/shared/api/ui/*' \) \
            -print | sort > /tmp/vklean-theme/diag/theme-files.txt

          while IFS= read -r file; do
            [[ -f "$file" ]] || continue
            rel="${file#/tmp/vklean-theme/decode/}"
            out="/tmp/vklean-theme/diag/files/${rel}"
            mkdir -p "$(dirname "$out")"
            cp "$file" "$out"
          done < /tmp/vklean-theme/diag/theme-files.txt

          cp /tmp/vklean-theme/decode/resources/package_1/res/values/colors.xml \
            /tmp/vklean-theme/diag/colors.xml
          cp /tmp/vklean-theme/decode/resources/package_1/res/values-night/colors.xml \
            /tmp/vklean-theme/diag/colors-night.xml
          cp /tmp/vklean-theme/decode/resources/package_1/res/values-night/styles.xml \
            /tmp/vklean-theme/diag/styles-night.xml

          echo "Theme files: $(wc -l < /tmp/vklean-theme/diag/theme-files.txt)"

      - name: Upload theme provider diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vklean-theme-provider-diagnostics
          path: /tmp/vklean-theme/diag/**
          if-no-files-found: error

      - name: Upload MPP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vk-video-morphe-patches
          path: patches/build/libs/*.mpp
          if-no-files-found: error
