name: CI

on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'extensions/**'
      - 'ci/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'patches-list.json'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'patches/**'
      - 'extensions/**'
      - 'ci/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'patches-list.json'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build-patches:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.7.1'

      - name: Repository consistency
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n1)"
          [[ "$(jq -r '.version' patches-list.json)" == "$VERSION" ]]
          python -m py_compile ci/select_upstream.py ci/verify_patched_apk.py ci/verify_manifest.py
          python -m json.tool ci/baseline.json >/dev/null
          python -m json.tool patches-list.json >/dev/null

      - name: Build Morphe bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle :patches:buildAndroid --no-daemon

      - name: Integration test VKlean playback speed on VK Video 1.165
        run: |
          set -euo pipefail

          curl -fL --retry 4 \
            -o rustore-downloader.tar.gz \
            "https://github.com/RD2W/rustore-apk-downloader/releases/download/v1.4.0/RuStore_ApkDownloader_v1.4.0_linux-x86_64.tar.gz"
          echo "8ba94847a616b7b5d032285141253b8e3e2cb79d1119b827f558d48b6a157ca0  rustore-downloader.tar.gz" | sha256sum -c -
          mkdir -p tools/rustore /tmp/vklean-playback
          tar -xzf rustore-downloader.tar.gz -C tools/rustore
          chmod +x tools/rustore/rustore_apk_downloader
          tools/rustore/rustore_apk_downloader com.vk.vkvideo /tmp/vklean-playback

          APK="$(find /tmp/vklean-playback -type f -name '*.apk' -print -quit)"
          test -n "$APK"

          curl -fL --retry 4 \
            -o morphe.jar \
            "https://github.com/MorpheApp/morphe-desktop/releases/download/v1.16.0/morphe-desktop-1.16.0-all.jar"
          echo "82a0df2ff881d83d5ca8b4f9a6ce196bd4ac3b87ff147fe37845c296b436806c  morphe.jar" | sha256sum -c -

          MPP="$(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' ! -name '*sources*' ! -name '*javadoc*' -print -quit)"
          test -n "$MPP"

          java -jar morphe.jar patch \
            -p "$MPP" \
            --force \
            --exclusive \
            -e "Playback speed" \
            --unsigned \
            -r /tmp/vklean-playback-result.json \
            -o /tmp/vklean-playback.apk \
            "$APK"

          jq -e '
            ((.failedPatches // []) | length) == 0 and
            any(.appliedPatches[]?; .name == "VKlean settings") and
            any(.appliedPatches[]?; .name == "Playback speed")
          ' /tmp/vklean-playback-result.json >/dev/null

          python - <<'PY'
          import zipfile

          apk = "/tmp/vklean-playback.apk"
          needles = [
              b"app/vklean/extension/settings/VkleanPreferences",
              b"overridePlaybackSpeed",
              b"app/vklean/extension/settings/VkleanSettingsActivity",
          ]

          with zipfile.ZipFile(apk) as archive:
              dex_names = [name for name in archive.namelist()
                           if name.startswith("classes") and name.endswith(".dex")]
              dex = b"".join(archive.read(name) for name in dex_names)
              for needle in needles:
                  if needle not in dex:
                      raise SystemExit("Missing injected playback marker: " + needle.decode())

              manifest = archive.read("AndroidManifest.xml")
              activity = "app.vklean.extension.settings.VkleanSettingsActivity"
              if activity.encode() not in manifest and activity.encode("utf-16le") not in manifest:
                  raise SystemExit("VKlean settings activity is missing from manifest")
          PY

          echo "VKlean playback speed patch applied successfully to VK Video 1.165."

      - name: Upload MPP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vk-video-morphe-patches
          path: patches/build/libs/*.mpp
          if-no-files-found: error
