name: CI

on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'extensions/**'
      - 'ci/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'patches-list.json'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'patches/**'
      - 'extensions/**'
      - 'ci/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'patches-list.json'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build-patches:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.7.1'

      - name: Repository consistency
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n1)"
          [[ "$(jq -r '.version' patches-list.json)" == "$VERSION" ]]
          python -m py_compile ci/select_upstream.py ci/verify_patched_apk.py ci/verify_manifest.py
          python -m json.tool ci/baseline.json >/dev/null
          python -m json.tool patches-list.json >/dev/null

      - name: Build Morphe bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle :patches:buildAndroid --no-daemon

      - name: Integration test VKlean AMOLED theme on VK Video 1.165
        run: |
          set -euo pipefail

          curl -fL --retry 4 \
            -o rustore-downloader.tar.gz \
            "https://github.com/RD2W/rustore-apk-downloader/releases/download/v1.4.0/RuStore_ApkDownloader_v1.4.0_linux-x86_64.tar.gz"
          echo "8ba94847a616b7b5d032285141253b8e3e2cb79d1119b827f558d48b6a157ca0  rustore-downloader.tar.gz" | sha256sum -c -
          mkdir -p tools/rustore /tmp/vklean-amoled
          tar -xzf rustore-downloader.tar.gz -C tools/rustore
          chmod +x tools/rustore/rustore_apk_downloader
          tools/rustore/rustore_apk_downloader com.vk.vkvideo /tmp/vklean-amoled

          APK="$(find /tmp/vklean-amoled -type f -name '*.apk' -print -quit)"
          test -n "$APK"

          curl -fL --retry 4 \
            -o morphe.jar \
            "https://github.com/MorpheApp/morphe-desktop/releases/download/v1.16.0/morphe-desktop-1.16.0-all.jar"
          echo "82a0df2ff881d83d5ca8b4f9a6ce196bd4ac3b87ff147fe37845c296b436806c  morphe.jar" | sha256sum -c -

          MPP="$(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' ! -name '*sources*' ! -name '*javadoc*' -print -quit)"
          test -n "$MPP"

          java -jar morphe.jar patch \
            -p "$MPP" \
            --force \
            --exclusive \
            -e "AMOLED theme" \
            --unsigned \
            -r /tmp/vklean-amoled-result.json \
            -o /tmp/vklean-amoled.apk \
            "$APK"

          jq -e '
            ((.failedPatches // []) | length) == 0 and
            any(.appliedPatches[]?; .name == "AMOLED theme")
          ' /tmp/vklean-amoled-result.json >/dev/null

          curl -fL --retry 4 \
            -o APKEditor.jar \
            "https://github.com/REAndroid/APKEditor/releases/download/V1.4.1/APKEditor-1.4.1.jar"
          java -jar APKEditor.jar d \
            -i /tmp/vklean-amoled.apk \
            -o /tmp/vklean-amoled/decode >/dev/null

          OVERLAY="$(grep -Rl 'VKleanAmoledOverlay' /tmp/vklean-amoled/decode --include='*.xml' | head -n1)"
          test -n "$OVERLAY"

          OVERLAY="$OVERLAY" python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          import zipfile

          overlay = os.environ["OVERLAY"]
          root = ET.parse(overlay).getroot()
          style = next(
              (node for node in root.findall("style")
               if node.attrib.get("name") == "VKleanAmoledOverlay"),
              None,
          )
          if style is None:
              raise SystemExit("VKleanAmoledOverlay was not decoded")

          values = {
              node.attrib.get("name"): (node.text or "").strip().lower()
              for node in style.findall("item")
          }
          black = {"#000000", "#ff000000", "@color/vk_black"}
          required = [
              "vk_ui_background_content",
              "vk_ui_background_modal",
              "vk_legacy_background_content",
              "vk_ui_vkontakte_color_tabbar_background",
          ]
          for name in required:
              if values.get(name) not in black:
                  raise SystemExit(f"{name} is not black in AMOLED overlay: {values.get(name)!r}")

          apk = "/tmp/vklean-amoled.apk"
          needles = [
              b"app/vklean/extension/settings/ThemeOverride",
              b"amoledTheme",
          ]
          with zipfile.ZipFile(apk) as archive:
              dex_names = [name for name in archive.namelist()
                           if name.startswith("classes") and name.endswith(".dex")]
              dex = b"".join(archive.read(name) for name in dex_names)
              for needle in needles:
                  if needle not in dex:
                      raise SystemExit("Missing AMOLED runtime marker: " + needle.decode())

              resources = archive.read("resources.arsc")
              name = "VKleanAmoledOverlay"
              if name.encode() not in resources and name.encode("utf-16le") not in resources:
                  raise SystemExit("AMOLED overlay resource is missing from resources.arsc")
          PY

          echo "VKlean AMOLED theme applied successfully to VK Video 1.165."

      - name: Upload MPP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vk-video-morphe-patches
          path: patches/build/libs/*.mpp
          if-no-files-found: error
